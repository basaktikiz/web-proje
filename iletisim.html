<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>İletişim — Web Projem</title>
</head>
<body>
    <header>
        <h1>Proje İletişim Sayfası</h1>
        <nav>
            <ul>
                <li><a href="index.html">Anasayfa</a></li>
                <li><a href="hakkinda.html">Hakkımda</a></li>
                <li><a href="iletisim.html">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Bize Ulaşın</h2>
            <p>Görüş ve önerileriniz için aşağıdaki formu doldurabilirsiniz.</p>

            <form action="#" method="POST">
                
                <div>
                    <label for="adsoyad">Adınız Soyadınız</label><br>
                    <input type="text" id="adsoyad" name="adsoyad" required autocomplete="name" placeholder="Örn. Başak Zeynep Tıkız">
                </div>
                <br>

                <div>
                    <label for="eposta">E-posta Adresiniz</label><br>
                    <input type="email" id="eposta" name="eposta" required autocomplete="email" placeholder="ornek@gmail.com">
                </div>
                <br>

                <div>
                    <label for="telefon">Telefon Numaranız</label><br>
                    <input type="tel" id="telefon" name="telefon" autocomplete="tel" placeholder="0530...">
                </div>
                <br>

                <div>
                    <label for="parola">Parola (En az 8 karakter)</label><br>
                    <input type="password" id="parola" name="parola" required minlength="8" autocomplete="new-password">
                </div>
                <br>

                <div>
                    <label for="konu">İletişim Konusu</label><br>
                    <select id="konu" name="konu" required>
                        <option value="">Lütfen bir konu seçin...</option>
                        <option value="oneri">Öneri ve İstek</option>
                        <option value="hata">Hata Bildirimi</option>
                        <option value="diger">Diğer</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="mesaj">Mesajınız</label><br>
                    <textarea id="mesaj" name="mesaj" rows="4" required minlength="10" placeholder="Mesajınızı en az 10 karakter olacak şekilde yazın..."></textarea>
                </div>
                <br>

                <button type="submit">Gönder</button>

            </form>
            
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Web Projem. Tüm hakları saklıdır.</p>
    </footer>
</body>
</html>
